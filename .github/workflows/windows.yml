name: Windows build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LumaFlow --icon assets/lumaflow.ico --hidden-import orgb_worker --collect-all bleak --collect-all pyaudiowpatch --collect-all openrgb app.py
      - uses: actions/upload-artifact@v4
        with:
          name: LumaFlow-Windows
          path: dist/LumaFlow

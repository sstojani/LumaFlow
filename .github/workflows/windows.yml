name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LumaFlow-Windows-${{ github.sha }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaFlow-smoke-${{ github.sha }}
          path: review-output/packaged
